# mihomo 客户端示例
#
# 用法：
#   1. 复制到 Clash Verge 的 profiles 目录
#   2. 替换所有 {{PLACEHOLDER}}
#   3. 在 GUI 中选择该配置
#
# 自签证书：
#   Hysteria2 用自签证书时必须设 skip-cert-verify: true
#   否则报 x509: certificate signed by unknown authority

mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true

proxies:
  # ── VLESS + REALITY + Vision（TCP 443）────────────────────
  # 伪装成真实网站，无需域名和证书
  - name: "VLESS"
    type: vless
    server: {{VPS_IP}}
    port: 443
    uuid: {{UUID}}
    network: tcp
    tls: true
    udp: true
    # ★ 必须与服务端 flow 一致，裸 VLESS 已弃用
    flow: xtls-rprx-vision
    servername: {{REALITY_TARGET}}
    client-fingerprint: chrome
    reality-opts:
      public-key: {{REALITY_PUBLIC_KEY}}
      short-id: {{REALITY_SHORT_ID}}

  # ── Hysteria2（UDP 443）──────────────────────────────────
  # 弱网性能最好，TCP 受限时使用
  - name: "HY2"
    type: hysteria2
    server: {{VPS_IP}}
    port: {{HY2_PORT}}
    password: {{HY2_PASSWORD}}
    # 自签证书时必须为 true
    skip-cert-verify: true
    sni: {{SERVER_NAME}}
    # 按 VPS 实际带宽填写
    up: "{{UP_MBPS}}"
    down: "{{DOWN_MBPS}}"
    obfs: salamander
    obfs-password: {{HY2_OBFS_PASSWORD}}
    alpn:
      - h3

  # ── 可选：WARP 出口（AI 流量用）──────────────────────────
  - name: "WARP"
    type: socks5
    server: {{LOCALHOST}}
    port: 40000
    udp: true

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "VLESS"
      - "HY2"
      - "♻️ 自动选择"

  - name: "♻️ 自动选择"
    type: url-test
    proxies:
      - "VLESS"
      - "HY2"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🤖 AI 服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "WARP"

rules:
  # 局域网直连
  - GEOIP,PRIVATE,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve

  # AI 服务走独立出口（避免机房 IP 风控）
  - DOMAIN-SUFFIX,openai.com,🤖 AI 服务
  - DOMAIN-SUFFIX,chatgpt.com,🤖 AI 服务
  - DOMAIN-SUFFIX,oaistatic.com,🤖 AI 服务
  - DOMAIN-SUFFIX,oaiusercontent.com,🤖 AI 服务
  - DOMAIN-SUFFIX,anthropic.com,🤖 AI 服务
  - DOMAIN-SUFFIX,claude.ai,🤖 AI 服务
  - DOMAIN-SUFFIX,gemini.google.com,🤖 AI 服务
  - DOMAIN-SUFFIX,aistudio.google.com,🤖 AI 服务
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,🤖 AI 服务

  # 其余走代理
  - MATCH,🚀 节点选择